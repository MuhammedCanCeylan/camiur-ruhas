<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CÂMİU'R-RUHAS VE TAHKÎKU'L-MEZÂHİB — 3D Ciltli Kütüphane</title>

<!-- StPageFlip Styles -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/css/page-flip.min.css">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    --leather-outer: #30110d;
    --leather-dark: #1a0806;
    --gold: #d4af37;
    --gold-bright: #f5d77f;
    --gold-dim: #94772b;
    --paper: #fbf6ec;
    --paper-dark: #eee3cc;
    --paper-edge: #decfae;
    --ink: #221810;
    --ink-soft: #4a3b2c;
    --ink-dim: #7a6a57;
    --ruby: #7a1d1d;
    --emerald: #1c5234;
    
    --page-w: 470px;
    --page-h: 680px;
    --book-font-size: 15px;
    --zoom-factor: 1.0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    width: 100vw; height: 100vh;
    background: #050403;
    font-family: 'Crimson Pro', Georgia, serif;
    color: var(--ink);
    overflow: hidden;
    user-select: none;
  }

  /* 3D WebGL Sahnesi */
  #webgl-canvas {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    display: block; z-index: 1;
  }

  /* 3D Sahne Üst Bilgi */
  .desk-overlay-ui {
    position: fixed; top: 24px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center;
    pointer-events: none; z-index: 10;
    opacity: 0; transform: translateY(-16px);
    transition: opacity 0.7s cubic-bezier(0.22,1,0.36,1), transform 0.7s cubic-bezier(0.22,1,0.36,1);
  }
  .desk-overlay-ui.visible { opacity: 1; transform: translateY(0); }
  .desk-overlay-ui.hidden { opacity: 0; transform: translateY(-16px); }
  .desk-kicker {
    font-family: 'Cinzel', serif; font-size: 11px;
    letter-spacing: 0.35em; color: var(--gold);
    text-transform: uppercase; margin-bottom: 4px;
    text-shadow: 0 2px 4px #000;
  }
  .desk-heading {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px; color: #fdf6e6; font-weight: 700;
    letter-spacing: 0.05em; text-shadow: 0 3px 8px #000;
  }
  .desk-divider {
    width: 70px; height: 1.5px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 8px auto 0;
  }
  .desk-hint {
    color: #c5ad88; font-size: 13.5px; font-style: italic; margin-top: 6px;
    text-shadow: 0 2px 4px #000;
  }

  /* OKUYUCU EKRANI (Kitap açılınca üste biner) */
  #reader-screen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    z-index: 20; opacity: 0; pointer-events: none;
    filter: blur(14px);
    transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), filter 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    background: radial-gradient(circle at 50% 45%, rgba(13, 9, 6, 0.78) 0%, rgba(5, 4, 3, 0.94) 100%);
  }
  #reader-screen.screen-active {
    opacity: 1; pointer-events: auto; filter: blur(0);
  }


  /* Üst Kontrol Çubuğu */
  .top-toolbar {
    position: fixed; top: 0; left: 0; right: 0; height: 52px;
    background: linear-gradient(180deg, rgba(16,11,8,0.96) 0%, rgba(24,16,12,0.88) 100%);
    border-bottom: 1px solid rgba(212,175,55,0.25);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; z-index: 50;
    backdrop-filter: blur(8px);
    font-family: 'Cormorant Garamond', serif;
  }
  .reader-left { display: flex; align-items: center; gap: 12px; }
  .back-to-desk-btn {
    background: rgba(212,175,55,0.18);
    border: 1px solid rgba(212,175,55,0.5);
    color: #f7eed7; padding: 6px 14px 6px 10px;
    border-radius: 20px; font-family: 'Cormorant Garamond', serif;
    font-size: 14px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: all 0.2s ease;
  }
  .back-to-desk-btn:hover { background: rgba(212,175,55,0.35); color: #fff; transform: translateX(-2px); }
  .reader-title { color: #f1e4c7; font-size: 17px; font-weight: 700; letter-spacing: 0.05em; }

  .top-actions { display: flex; align-items: center; gap: 8px; }
  .action-btn {
    background: rgba(233,220,192,0.08); border: 1px solid rgba(212,175,55,0.35);
    color: #efe2c4; padding: 5px 12px; border-radius: 6px;
    font-family: 'Cormorant Garamond', serif; font-size: 13.5px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
    transition: all 0.2s ease;
  }
  .action-btn:hover { background: rgba(212,175,55,0.22); color: #fff; }

  /* Okuyucu Sahnesi */
  .viewport {
    position: fixed; inset: 52px 0 60px 0;
    display: flex; align-items: center; justify-content: center;
    perspective: 2600px; overflow: hidden;
  }

  .book-container {
    position: relative;
    width: calc(var(--page-w) * 2);
    height: var(--page-h);
    transform-style: preserve-3d;
    opacity: 0;
    transform: translateX(0) scale(var(--zoom-factor, 1.0));
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease;
  }
  .book-container.container-visible { opacity: 1; }
  .book-container.is-cover-closed { transform: translateX(calc(var(--page-w) * -0.5)) scale(var(--zoom-factor, 1.0)); }
  .book-container.is-back-closed { transform: translateX(calc(var(--page-w) * 0.5)) scale(var(--zoom-factor, 1.0)); }

  .book-shadow {
    position: absolute; left: 50%; bottom: -30px; transform: translateX(-50%);
    width: 92%; height: 46px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.8) 0%, transparent 75%);
    filter: blur(6px); pointer-events: none; z-index: 1;
  }

  #flipbook {
    width: calc(var(--page-w) * 2);
    height: var(--page-h);
    margin: 0 auto; position: relative; z-index: 5;
  }

  /* Sayfa Stilleri */
  .page {
    width: 100%; height: 100%;
    background-color: var(--paper);
    overflow: hidden; box-sizing: border-box;
  }
  .page[data-density="hard"] { background-color: var(--leather-dark); }

  .cover-face {
    width: 100%; height: 100%; color: #f7eed7;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 34px 26px; text-align: center;
    border: 2px solid rgba(212,175,55,0.45); position: relative;
    box-shadow: inset 0 0 32px rgba(0,0,0,0.85); box-sizing: border-box;
  }
  .cover-face::before { content: ""; position: absolute; inset: 10px; border: 1.5px solid rgba(212,175,55,0.65); border-radius: 2px; }
  .cover-face::after { content: ""; position: absolute; inset: 15px; border: 1px dashed rgba(212,175,55,0.35); }

  .shamsah {
    width: 78px; height: 78px; border-radius: 50%;
    border: 2px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
    background: radial-gradient(circle, rgba(212,175,55,0.2) 0%, rgba(0,0,0,0.4) 100%);
  }
  .shamsah svg { width: 44px; height: 44px; fill: var(--gold); }

  .cover-kicker { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.35em; color: var(--gold); margin-bottom: 8px; }
  .cover-title-ar { font-family: 'Amiri', serif; font-size: 26px; font-weight: 700; color: var(--gold-bright); direction: rtl; margin-bottom: 6px; }
  .cover-title-tr { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 22px; color: #f7eed7; margin-bottom: 8px; }
  .cover-rule { width: 60px; height: 1.5px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 8px auto 12px; }
  .cover-subtitle { font-family: 'Crimson Pro', serif; font-style: italic; font-size: 13.5px; color: #c9b78f; line-height: 1.4; max-width: 300px; margin-bottom: 18px; }
  .cover-author { font-family: 'Cormorant Garamond', serif; font-size: 13px; color: var(--gold); letter-spacing: 0.15em; border-top: 1px solid rgba(212,175,55,0.3); padding-top: 8px; }

  .cover-inside {
    width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, #e2d7c0 0%, #c5b592 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 30px; text-align: center;
  }
  .ex-libris-frame {
    background: rgba(251, 246, 236, 0.95); border: 2px solid var(--gold);
    padding: 22px 18px; border-radius: 4px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }

  .page-inner {
    width: 100%; height: 100%; display: flex; flex-direction: column;
    padding: 26px 22px 20px; position: relative;
    font-size: var(--book-font-size); line-height: 1.55; color: var(--ink);
    user-select: text; box-sizing: border-box;
  }
  .page-inner::after {
    content: ""; position: absolute; inset: 10px;
    border: 1px solid rgba(212,175,55,0.45); pointer-events: none;
  }

  .running-header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(143,114,38,0.35);
    padding-bottom: 5px; margin-bottom: 10px;
    font-family: 'Cormorant Garamond', serif; font-size: 11.5px; color: var(--ink-dim);
  }
  .running-footer {
    margin-top: auto; display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid rgba(143,114,38,0.25); padding-top: 5px;
    font-family: 'Cormorant Garamond', serif; font-size: 12px; color: var(--ink-dim);
  }

  .section-kicker { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.2em; color: var(--gold-dim); font-weight: 700; margin-bottom: 2px; }
  .chapter-title { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 700; color: var(--ruby); margin-bottom: 8px; border-bottom: 1px solid rgba(122,29,29,0.18); padding-bottom: 4px; }

  .ruhsat-banner {
    background: linear-gradient(135deg, rgba(28,82,52,0.08), rgba(212,175,55,0.12));
    border: 1px solid rgba(28,82,52,0.45); border-left: 4px solid var(--emerald);
    padding: 6px 10px; margin: 6px 0; border-radius: 0 4px 4px 0;
  }
  .ruhsat-badge { background: var(--emerald); color: #fff; font-family: 'Cinzel', serif; font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 3px; }
  .ruhsat-text { font-weight: 600; color: var(--leather-dark); font-size: 13.5px; margin-top: 2px; }

  .mezhep-grid { display: grid; grid-template-columns: 1fr; gap: 5px; margin: 6px 0; }
  .mezhep-card { background: rgba(255,255,255,0.65); border: 1px solid rgba(143,114,38,0.25); border-radius: 3px; padding: 5px 8px; }
  .mezhep-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
  .mezhep-name { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 13.5px; }
  .mezhep-tag { font-size: 8.5px; padding: 1px 4px; border-radius: 3px; font-weight: 600; text-transform: uppercase; }
  .mezhep-tag.hanefi { background: rgba(28,82,52,0.15); color: #154228; border: 1px solid #1c5234; }
  .mezhep-tag.shafii { background: rgba(24,62,104,0.15); color: #113155; border: 1px solid #183e68; }
  .mezhep-tag.maliki { background: rgba(122,29,29,0.15); color: #611313; border: 1px solid #7a1d1d; }
  .mezhep-tag.hanbeli { background: rgba(135,84,18,0.15); color: #633c09; border: 1px solid #875412; }

  .arabic-quote {
    font-family: 'Amiri', serif; direction: rtl; font-size: 14.5px;
    color: #3b2a1a; background: rgba(212,175,55,0.08); padding: 2px 6px;
    border-radius: 3px; border-right: 2px solid var(--gold); margin-top: 2px;
  }

  .telfik-box {
    background: rgba(122,29,29,0.06); border: 1px dashed rgba(122,29,29,0.4);
    padding: 6px 8px; border-radius: 3px; margin-top: 6px; font-size: 13px;
  }
  .telfik-title { font-weight: 700; color: var(--ruby); font-family: 'Cinzel', serif; font-size: 9.5px; }

  /* Alt Gezinme Çubuğu */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
    background: linear-gradient(0deg, rgba(16,11,8,0.96) 0%, rgba(24,16,12,0.88) 100%);
    border-top: 1px solid rgba(212,175,55,0.25);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; z-index: 50;
    backdrop-filter: blur(8px);
    font-family: 'Cormorant Garamond', serif;
  }
  .nav-group { display: flex; align-items: center; gap: 8px; }
  .nav-btn {
    background: rgba(233,220,192,0.08); border: 1px solid rgba(212,175,55,0.35);
    color: #efe2c4; width: 34px; height: 34px; border-radius: 50%; font-size: 16px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .nav-btn:hover { background: rgba(212,175,55,0.25); color: #fff; }
  .page-status { color: #eeddbb; font-size: 14px; min-width: 130px; text-align: center; font-style: italic; }

  .cover-toggle-btn {
    background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(122,29,29,0.3));
    border: 1px solid var(--gold); color: #f7eed7; font-weight: 600;
    padding: 4px 11px; border-radius: 16px; cursor: pointer; font-size: 12.5px;
  }

  .tool-group { display: flex; align-items: center; gap: 10px; }
  .tool-subgroup {
    display: flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.3);
    padding: 3px 7px; border-radius: 16px; border: 1px solid rgba(212,175,55,0.2);
  }
  .tool-label { font-size: 11.5px; color: #bfa886; }
  .tool-btn {
    background: rgba(233,220,192,0.1); border: 1px solid rgba(212,175,55,0.25);
    color: #f3e5c8; min-width: 24px; height: 24px; border-radius: 12px;
    font-size: 12px; cursor: pointer;
  }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10,6,4,0.75); backdrop-filter: blur(5px);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.active { display: flex; }
  .modal-card {
    background: #fbf6ec; border: 2px solid var(--gold); border-radius: 6px;
    width: 90%; max-width: 520px; max-height: 80vh; display: flex; flex-direction: column;
  }
  .modal-header {
    background: var(--leather-dark); color: var(--gold); padding: 12px 18px;
    border-bottom: 2px solid var(--gold); display: flex; align-items: center; justify-content: space-between;
  }
  .modal-close { background: none; border: none; color: #f5eed8; font-size: 20px; cursor: pointer; }
  .modal-body { padding: 14px 18px; overflow-y: auto; }
  .toc-list { list-style: none; }
  .toc-item {
    display: flex; justify-content: space-between; padding: 6px 4px;
    border-bottom: 1px dotted rgba(143,114,38,0.3); cursor: pointer;
  }
  .toc-item:hover { background: rgba(212,175,55,0.15); color: var(--ruby); }
</style>
</head>
<body>

  <!-- 3D Masanın Üst Başlığı -->
  <div class="desk-overlay-ui" id="deskUi">
    <div class="desk-kicker">Kütüphane-i Hümâyûn</div>
    <h1 class="desk-heading">Ciltli Eserler Masası</h1>
    <div class="desk-divider"></div>
    <div class="desk-hint">İncelemek istediğiniz cilde dokunun</div>
  </div>

  <!-- 3D Three.js Sahnesi -->
  <canvas id="webgl-canvas"></canvas>



  <!-- 2D StPageFlip Okuyucu Arayüzü -->
  <div id="reader-screen">
    <header class="top-toolbar">
      <div class="reader-left">
        <button class="back-to-desk-btn" id="backToDeskBtn">
          <span>‹</span> Masaya Dön
        </button>
        <div class="reader-title" id="activeBookTitle">CÂMİU'R-RUHAS</div>
      </div>
      <div class="top-actions">
        <button class="action-btn" id="openTocBtn"><span>☰</span> Fihrist</button>
      </div>
    </header>

    <main class="viewport">
      <div class="book-container is-cover-closed" id="bookContainer">
        <div class="book-shadow"></div>
        <div id="flipbook"></div>
      </div>
    </main>

    <footer class="bottom-bar">
      <div class="nav-group">
        <button class="cover-toggle-btn" id="closeFrontBtn">Ön Kapak</button>
        <button class="nav-btn" id="prevBtn">‹</button>
        <span class="page-status" id="pageStatus">Ön Kapak (Cilt)</span>
        <button class="nav-btn" id="nextBtn">›</button>
        <button class="cover-toggle-btn" id="closeBackBtn">Arka Kapak</button>
      </div>

      <div class="tool-group">
        <div class="tool-subgroup">
          <span class="tool-label">Yazı:</span>
          <button class="tool-btn" id="fontDecBtn">A−</button>
          <button class="tool-btn" id="fontIncBtn">A+</button>
        </div>
        <div class="tool-subgroup">
          <span class="tool-label">Kitap:</span>
          <button class="tool-btn" id="zoomOutBtn">−</button>
          <span class="tool-label" id="zoomDisplay" style="color:var(--gold-bright); font-weight:600; min-width:32px; text-align:center;">100%</span>
          <button class="tool-btn" id="zoomInBtn">+</button>
        </div>
      </div>
    </footer>
  </div>

  <!-- Fihrist Modalı -->
  <div class="modal-overlay" id="tocModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 style="font-family:'Cinzel',serif; font-size:14px;">FİHRİST-İ MEZÂHİB</h3>
        <button class="modal-close" id="closeTocModal">&times;</button>
      </div>
      <div class="modal-body" id="modalTocList"></div>
    </div>
  </div>

  <!-- Kütüphaneler: Three.js, Tween.js ve StPageFlip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <script>
    /* =========================================================================
       1. VERİ KATMANI (KİTAPLAR VE İÇERİK)
       ========================================================================= */
    const BOOKS_CATALOG = [
      {
        id: "camiur-ruhas",

        subtitle: "Dört Mezhep Esaslı En Hafif ve Sahih Fıkıh Külliyatı",
        author: "Tahkîk-i Evvel",
        theme: { leather: "#30110d", leatherDark: "#1a0806" }
      },
      {
        id: "kitabu-sifa",
        title: "KİTÂB-I ŞİFÂ",
        sub: "CİLD-İ SÂNÎ",
        color: "#0d2b1a",
        x: 0,
        arabic: "كِتَابُ الشِّفَاءِ",
        subtitle: "Esrâr-ı Hikmet ve Tabiat Mecmuası",
        author: "Kâtip Çelebi Nüshası",
        theme: { leather: "#0d2b1a", leatherDark: "#06150d" }
      },
      {
        id: "mirac-i-felek",
        title: "Mİ'RÂC-I FELEK",
        sub: "CİLD-İ SÂLİS",
        color: "#101d33",
        x: 3.8,
        arabic: "مِعْرَاجُ الفَلَكِ",
        subtitle: "Seyrü'l-Aflâk ve Derya Seyrüsefer Kayıtları",
        author: "Seydi Ali Reis Heyeti",
        theme: { leather: "#101d33", leatherDark: "#080e1a" }
      }
    ];

    const FIKIH_MESELELERI = [
      {
        bolum: "KITÂBÜ'T-TAHÂRET",
        mesele: "MESELE 001: Abdestte Niyetin Farziyeti",
        ruhsat: "Abdestte niyet farz veya sıhhat şartı değildir, sünnettir. Niyetsiz alınan abdest sahihtir.",
        mezhep: "Hanefî Mezhebi",
        h1: "Sünnet / Müstehap (Su bizâtihi temizleyicidir).",
        k1: "es-Serahsî (el-Mebsût)",
        ar1: "ولنا آية الوضوء ففيها تنصيص على الغسل والمسح وذلك يتحقق بدون النية",
        h2: "Farz / Rükün (Niyetsiz abdest geçersizdir).",
        k2: "er-Remlî (Nihâyetü'l-Muhtâc)",
        h3: "Farz / Sıhhat Şartı (İbadetin ayrılmaz parçasıdır).",
        k3: "el-Hattâb (Mevâhibü'l-Celîl)",
        h4: "Farz / Şart (Müstakil niyete muhtaçtır).",
        k4: "el-Buhûtî (Keşşâfü'l-Kınâ')",

        k3: "İbn Abdilberr (el-Kâfî)",

        k4: "el-Merdâvî (el-İnsâf)",

        telfik: "Trafik veya mola imkânsızlığında Hanbelî ruhsatıyla amel etmek icmâ-i mürekkep doğurmaz."

    /* =========================================================================
       2. THREE.JS 3D MASA VE KİTAPLAR
       ========================================================================= */
    const canvas = document.getElementById('webgl-canvas');
    const deskUi = document.getElementById('deskUi');
    const readerScreen = document.getElementById('reader-screen');
    const activeBookTitleEl = document.getElementById('activeBookTitle');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050403);
    scene.fog = new THREE.FogExp2(0x050403, 0.038);

    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
    const CAMERA_REST = { x: 0, y: 9.8, z: 13.2 };
    const CAMERA_LOOK = { x: 0, y: 0.3, z: 0 };
    // Sahne ilk yüklendiğinde biraz uzaktan, yukarıdan başlar (girişte yumuşak yaklaşma hissi için)
    camera.position.set(0, 15.5, 21.5);
    camera.lookAt(CAMERA_LOOK.x, CAMERA_LOOK.y, CAMERA_LOOK.z);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;

    // Işıklar
    scene.add(new THREE.AmbientLight(0xd4c2a5, 0.45));

    const keyLight = new THREE.DirectionalLight(0xffeedd, 1.1);
    keyLight.position.set(4, 14, 8);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.bias = -0.0003;
    scene.add(keyLight);

    const warmFill = new THREE.PointLight(0xffaa44, 0.75, 25);
    warmFill.position.set(-5, 4, 3);
    scene.add(warmFill);

    // Ahşap Masa
    function createWoodTexture() {
      const cv = document.createElement('canvas');
      cv.width = 1024; cv.height = 1024;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#140d08';
      ctx.fillRect(0, 0, 1024, 1024);
      for (let y = 0; y < 1024; y += 4) {
        let shade = Math.sin(y * 0.02) * 12;
        ctx.fillStyle = `rgb(${24 + shade}, ${16 + shade * 0.7}, ${10 + shade * 0.5})`;
        ctx.fillRect(0, y, 1024, 4);
      }
      for (let i = 0; i < 900; i++) {
        ctx.fillStyle = `rgba(0, 0, 0, ${Math.random() * 0.28})`;
        ctx.fillRect(0, Math.random() * 1024, 1024, 1 + Math.random() * 3);
      }
      return new THREE.CanvasTexture(cv);
    }

    const table = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.MeshStandardMaterial({ map: createWoodTexture(), roughness: 0.55, metalness: 0.12 })
    );
    table.rotation.x = -Math.PI / 2;
    table.receiveShadow = true;
    scene.add(table);

    // Kağıt Kenar Dokusu
    function createPageEdgeTexture() {
      const cv = document.createElement('canvas');
      cv.width = 256; cv.height = 256;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#d6be92';
      ctx.fillRect(0, 0, 256, 256);
      for (let y = 0; y < 256; y += 2) {
        ctx.fillStyle = (y % 6 === 0) ? '#b09467' : '#c3a97c';
        ctx.fillRect(0, y, 256, 1.5);
      }
      return new THREE.CanvasTexture(cv);
    }
    const pageEdgeTexture = createPageEdgeTexture();

    // Deri ve Yaldızlı Kapak Dokusu
    function createCoverTexture(title, sub, baseColor) {
      const cv = document.createElement('canvas');
      cv.width = 1024; cv.height = 1400;
      const ctx = cv.getContext('2d');

      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, 1024, 1400);

      const grad = ctx.createRadialGradient(512, 700, 280, 512, 700, 750);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.75)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1400);

      ctx.fillStyle = '#1c130b';
      ctx.fillRect(110, 110, 804, 1180);

      const foilGrad = ctx.createLinearGradient(110, 110, 914, 1290);
      foilGrad.addColorStop(0, '#916e25');
      foilGrad.addColorStop(0.5, '#b9933a');
      foilGrad.addColorStop(1, '#81601d');
      ctx.fillStyle = foilGrad;
      ctx.fillRect(114, 114, 796, 1172);

      ctx.strokeStyle = '#2b1b07';
      ctx.lineWidth = 6;
      ctx.strokeRect(132, 132, 760, 1136);

      ctx.save();
      ctx.translate(512, 690);
      ctx.strokeStyle = '#2c1a05';
      ctx.lineWidth = 3;
      for (let i = 0; i < 32; i++) {
        const rad = (i * Math.PI) / 16;
        ctx.beginPath();
        ctx.moveTo(Math.cos(rad) * 45, Math.sin(rad) * 45);
        ctx.lineTo(Math.cos(rad) * 65, Math.sin(rad) * 65);
        ctx.stroke();
      }
      ctx.fillStyle = '#221303';
      ctx.beginPath();
      ctx.ellipse(0, 0, 42, 60, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#bfa157';
      ctx.font = '36px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('﷽', 0, 0);
      ctx.restore();

      ctx.fillStyle = '#1f1305';
      ctx.font = 'bold 54px "Cinzel", "Georgia", serif';
      ctx.textAlign = 'center';
      ctx.fillText(title, 512, 280);

      ctx.font = 'bold 30px "Cinzel", "Georgia", serif';
      ctx.fillText(sub, 512, 1110);

      return new THREE.CanvasTexture(cv);
    }

    const bookObjects = [];

    BOOKS_CATALOG.forEach((data, index) => {
      const group = new THREE.Group();
      // Kitaplar masaya yukarıdan, sırayla süzülerek iner (giriş animasyonu için başlangıç konumu)
      group.position.set(data.x, 4.5, -1.2);
      group.rotation.x = -0.18;

      const bw = 2.8, bh = 0.72, bd = 3.8;

      // Sayfa Bloğu
      const edgeMat = new THREE.MeshStandardMaterial({ map: pageEdgeTexture, roughness: 0.9 });
      const pages = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), edgeMat);
      pages.position.set(0.1, bh / 2 + 0.04, 0);
      pages.castShadow = true;
      pages.receiveShadow = true;
      group.add(pages);

      // Deri Kapaklar
      const coverMap = createCoverTexture(data.title, data.sub, data.color);
      const coverFrontMat = new THREE.MeshStandardMaterial({ map: coverMap, roughness: 0.75, metalness: 0.15 });
      const leatherPlainMat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.75, metalness: 0.05 });

      const bottomCover = new THREE.Mesh(new THREE.BoxGeometry(bw + 0.22, 0.08, bd + 0.22), leatherPlainMat);
      bottomCover.position.set(0.1, 0.04, 0);
      bottomCover.castShadow = true;
      group.add(bottomCover);

      const spine = new THREE.Mesh(new THREE.BoxGeometry(0.12, bh + 0.12, bd + 0.22), leatherPlainMat);
      spine.position.set(-bw / 2 - 0.01, (bh + 0.12) / 2, 0);
      group.add(spine);

      // Menteşeli Üst Kapak
      const topCoverHinge = new THREE.Group();
      topCoverHinge.position.set(-bw / 2 - 0.01, bh + 0.08, 0);

      const topCover = new THREE.Mesh(new THREE.BoxGeometry(bw + 0.22, 0.08, bd + 0.22), [
        leatherPlainMat, leatherPlainMat,
        coverFrontMat,
        new THREE.MeshStandardMaterial({ color: 0xeadbb8, roughness: 0.85 }),
        leatherPlainMat, leatherPlainMat
      ]);
      topCover.position.set((bw + 0.22) / 2, 0, 0);
      topCover.castShadow = true;
      topCoverHinge.add(topCover);
      group.add(topCoverHinge);

      group.userData = {
        bookData: data,
        originalPos: new THREE.Vector3(data.x, 0, 0),
        topCoverHinge: topCoverHinge,
        coverFrontMat: coverFrontMat,
        isHovered: false
      };

      scene.add(group);
      bookObjects.push(group);

      // Giriş animasyonu: kitap masaya yumuşakça, hafif bir sekmeyle iner
      new TWEEN.Tween(group.position)
        .to({ x: data.x, y: 0, z: 0 }, 1100)
        .delay(500 + index * 180)
        .easing(TWEEN.Easing.Back.Out)
        .start();
      new TWEEN.Tween(group.rotation)
        .to({ x: 0 }, 900)
        .delay(500 + index * 180)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();
    });

    // Kamera girişte yumuşakça yerine yaklaşır, ardından üst bilgi belirir
    new TWEEN.Tween(camera.position)
      .to(CAMERA_REST, 1900)
      .delay(150)
      .easing(TWEEN.Easing.Quartic.Out)
      .start();
    setTimeout(() => deskUi.classList.add('visible'), 1500);

    /* =========================================================================
       3. 3D SEÇİM & GEÇİŞ ANİMASYONU
       ========================================================================= */
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let selectedBookGroup = null;
    let hoveredBookGroup = null;
    let isTransitioning = false;

    function pickBookAt(clientX, clientY) {
      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(bookObjects, true);
      if (intersects.length === 0) return null;
      let obj = intersects[0].object;
      while (obj.parent && !obj.userData.topCoverHinge) obj = obj.parent;
      return (obj && obj.userData.topCoverHinge) ? obj : null;
    }

    // Fare/parmak bir kitabın üzerine geldiğinde hafifçe kalkıp ışıldayarak
    // "seçilebilir" olduğunu hissettirir — önceden hiçbir görsel geri bildirim yoktu.
    function setBookHover(group, isHover) {
      if (!group || group === selectedBookGroup) return;
      group.userData.isHovered = isHover;
      new TWEEN.Tween(group.position)
        .to({ y: isHover ? 0.32 : 0 }, 380)
        .easing(TWEEN.Easing.Quadratic.Out)
        .start();
      new TWEEN.Tween(group.userData.topCoverHinge.rotation)
        .to({ z: isHover ? 0.09 : 0 }, 380)
        .easing(TWEEN.Easing.Quadratic.Out)
        .start();
      const mat = group.userData.coverFrontMat;
      new TWEEN.Tween(mat)
        .to({ emissiveIntensity: isHover ? 0.35 : 0 }, 380)
        .easing(TWEEN.Easing.Quadratic.Out)
        .onUpdate(() => mat.emissive.set(0xd4af37))
        .start();
    }

    window.addEventListener('pointermove', (e) => {
      if (isTransitioning || selectedBookGroup) return;
      const hit = pickBookAt(e.clientX, e.clientY);
      if (hit !== hoveredBookGroup) {
        if (hoveredBookGroup) setBookHover(hoveredBookGroup, false);
        if (hit) setBookHover(hit, true);
        hoveredBookGroup = hit;
        canvas.style.cursor = hit ? 'pointer' : 'default';
      }
    });

    window.addEventListener('pointerdown', (e) => {
      if (isTransitioning || selectedBookGroup) return;
      const hit = pickBookAt(e.clientX, e.clientY);
      if (hit) triggerOpenBook(hit);
    });

    function triggerOpenBook(group) {
      isTransitioning = true;
      selectedBookGroup = group;
      if (hoveredBookGroup === group) hoveredBookGroup = null;
      canvas.style.cursor = 'default';
      deskUi.classList.add('hidden');

      // Hover sırasında kapak hafifçe aralanmış olabilir — açılışa kapalı başlasın.
      new TWEEN.Tween(group.userData.topCoverHinge.rotation).to({ z: 0 }, 200).start();

      const RISE_DURATION = 950;

      // Kitap, kameraya doğrudan bakacak şekilde ekranın ortasına kalkar.
      // Kapak burada AÇILMIYOR — kapalı kalıyor, çünkü açılma anı sadece
      // bir kez, 2D okuyucudaki gerçek sayfa çevirmede yaşanacak.
      new TWEEN.Tween(group.position)
        .to({ x: 0, y: 5.4, z: 6.8 }, RISE_DURATION)
        .easing(TWEEN.Easing.Cubic.InOut)
        .start();
      new TWEEN.Tween(group.rotation)
        .to({ x: 0.63, y: 0, z: 0 }, RISE_DURATION)
        .easing(TWEEN.Easing.Cubic.InOut)
        .start();
      new TWEEN.Tween(camera.position)
        .to({ x: 0, y: 8.6, z: 11.4 }, RISE_DURATION)
        .easing(TWEEN.Easing.Cubic.InOut)
        .start();

      // 3D kitap kameraya bakan konuma tam oturmadan (hareket hâlâ sürerken)
      // 2D okuyucuyu devreye alıyoruz: aynı kapalı kapak, aynı renk, hemen hemen
      // aynı ekran konumunda belirir. Göz hareketi takip ederken katmanlar
      // birbirinin üstüne kayarak geçer — ayrı bir "flaş" katmanına gerek kalmaz.
      setTimeout(() => {
        openStPageFlipReader(group.userData.bookData);
        isTransitioning = false;
      }, RISE_DURATION * 0.7);
    }

    function triggerCloseBook() {
      if (!selectedBookGroup || isTransitioning) return;
      isTransitioning = true;

      const group = selectedBookGroup;

      // 2D okuyucu kararıp bulanıklaşarak kaybolmaya başlar...
      readerScreen.classList.remove('screen-active');
      bookContainer.classList.remove('container-visible');

      // ...tam o sırada, aynı kapalı-kapak pozunda duran 3D kitap zaten
      // hazır ve görünür durumda olduğu için masaya inişi hemen başlatabiliriz.
      // Yeniden açılıp kapanan bir 3D kapak animasyonuna gerek yok (hiç açılmamıştı).
      new TWEEN.Tween(group.position)
        .to(group.userData.originalPos, 900)
        .delay(120)
        .easing(TWEEN.Easing.Cubic.InOut)
        .start();

      new TWEEN.Tween(group.rotation)
        .to({ x: 0, y: 0, z: 0 }, 900)
        .delay(120)
        .easing(TWEEN.Easing.Cubic.InOut)
        .onComplete(() => {
          selectedBookGroup = null;
          isTransitioning = false;
          deskUi.classList.remove('hidden');
        })
        .start();

      new TWEEN.Tween(camera.position)
        .to(CAMERA_REST, 950)
        .delay(120)
        .easing(TWEEN.Easing.Cubic.InOut)
        .start();
    }

    /* =========================================================================
       4. StPageFlip OKUYUCU MOTORU VE SAYFALAR
       ========================================================================= */
    let pageFlipInstance = null;
    let currentPagesData = [];
    const flipbookEl = document.getElementById('flipbook');
    const bookContainer = document.getElementById('bookContainer');
    const pageStatusEl = document.getElementById('pageStatus');

    function generatePages(book) {
      const pages = [];

      // Ön Kapak
      pages.push({
        density: 'hard',
        html: `
          <div class="cover-face" style="background: radial-gradient(circle at 35% 25%, rgba(255,255,255,0.1), transparent 40%), linear-gradient(150deg, ${book.theme.leather} 0%, ${book.theme.leatherDark} 100%);">
            <div class="shamsah"><svg viewBox="0 0 24 24"><path d="M12,2L14.5,7.5L20.5,8.5L16,13L17.5,19L12,16L6.5,19L8,13L3.5,8.5L9.5,7.5L12,2Z"/></svg></div>
            <div class="cover-kicker">Fıkhu'l-Mukâren</div>
            <div class="cover-title-ar">${book.arabic}</div>
            <div class="cover-title-tr">${book.title}</div>
            <div class="cover-rule"></div>
            <div class="cover-subtitle">${book.subtitle}</div>
            <div class="cover-author">${book.author}</div>
          </div>
        `
      });

      // İç Kapak (Ebru)
      pages.push({
        density: 'hard',
        html: `
          <div class="cover-inside">
            <div class="ex-libris-frame">
              <div style="font-family:'Cinzel',serif; font-size:12px; color:var(--leather-dark); letter-spacing:0.2em; font-weight:700;">VAKF-I KÜTÜB</div>
              <div style="font-family:'Amiri',serif; font-size:20px; color:var(--ruby); margin:8px 0;">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
              <div style="font-size:13px; color:var(--ink-soft); line-height:1.4;">
                <strong>${book.title}</strong><br>
                Ciltli Hususî Nüsha<br>
                <em style="color:#7a6a57; font-size:11px;">"Dinde zorluk yoktur; kolaylaştırınız, güçleştirmeyiniz."</em>
              </div>
            </div>
          </div>
        `
      });

      // Mukaddime
      pages.push({
        density: 'soft',
        html: `
          <div class="page-inner">
            <div class="running-header"><span>${book.title}</span><span>MUKADDİME</span></div>
            <div style="background:rgba(212,175,55,0.08); border:1px solid var(--gold); padding:12px; margin-bottom:12px; text-align:center; border-radius:3px;">
              <div style="font-family:'Amiri',serif; font-size:22px; color:var(--leather-outer); margin-bottom:4px; direction:rtl;">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
              <div class="section-kicker">USÛL VE METODOLOJİ</div>
              <h2 style="font-family:'Cormorant Garamond',serif; margin:3px 0; font-size:18px; color:var(--ruby);">En Hafif ve Sahih Fıkıh Ruhsatları</h2>
            </div>
            <p style="margin:0 0 10px; text-align:justify;">Bu eser; İslam Hukuku'nun dört hak mezhebi dairesinde kalarak, mükellefi meşakkatten kurtaran en hafif, uygulanabilir ve sahih ruhsatları tahrîc etmek amacıyla telif edilmiştir.</p>
            <div class="running-footer"><span>Tahrîc-i Evvel</span><span>— 1 —</span></div>
          </div>
        `
      });

      // Fihrist
      pages.push({
        density: 'soft',
        html: `
          <div class="page-inner">
            <div class="running-header"><span>${book.title}</span><span>FİHRİST</span></div>
            <div class="section-kicker">MÜNDERECÂT</div>
            <h2 class="chapter-title">Meseleler Fihristi</h2>
            <ul class="toc-list">
              <li class="toc-item" onclick="pageFlipInstance.turnToPage(4)"><span style="color:var(--gold-dim); font-weight:700;">001</span><span>Abdestte Niyetin Farziyeti</span><span>s. 3</span></li>
              <li class="toc-item" onclick="pageFlipInstance.turnToPage(6)"><span style="color:var(--gold-dim); font-weight:700;">002</span><span>Vücuttan Kan veya İrin Çıkması</span><span>s. 5</span></li>
              <li class="toc-item" onclick="pageFlipInstance.turnToPage(8)"><span style="color:var(--gold-dim); font-weight:700;">003</span><span>Meşakkat Anında Namazların Cem'i</span><span>s. 7</span></li>
            </ul>
            <div class="running-footer"><span>Münderecât</span><span>— 2 —</span></div>
          </div>
        `
      });

      // Mesele Çiftleri (Sol: Hüküm & Mezhepler, Sağ: Tahlil & Telfik)
      FIKIH_MESELELERI.forEach((m, idx) => {
        let pNum = 3 + (idx * 2);
        pages.push({
          density: 'soft',
          html: `
            <div class="page-inner">
              <div class="running-header"><span>${m.bolum}</span><span>${m.mesele.split(':')[0]}</span></div>
              <div class="section-kicker">${m.bolum}</div>
              <h2 class="chapter-title">${m.mesele}</h2>
              <div class="ruhsat-banner">
                <span class="ruhsat-badge">RUHSAT &amp; LİTE TATBİKAT</span>
                <div class="ruhsat-text">${m.ruhsat}</div>
                <div style="font-size:11.5px; color:var(--emerald); margin-top:2px; font-weight:600;">Esas: <u>${m.mezhep}</u></div>
              </div>
              <div class="mezhep-grid">
                <div class="mezhep-card">
                  <div class="mezhep-header"><span class="mezhep-name">Hanefî</span><span class="mezhep-tag hanefi">Hanefî</span></div>
                  <div style="font-size:12.5px;">${m.h1}</div>
                  <div class="arabic-quote">« ${m.ar1} »</div>
                </div>
                <div class="mezhep-card">
                  <div class="mezhep-header"><span class="mezhep-name">Şâfiî</span><span class="mezhep-tag shafii">Şâfiî</span></div>
                  <div style="font-size:12.5px;">${m.h2}</div>
                </div>
                <div class="mezhep-card">
                  <div class="mezhep-header"><span class="mezhep-name">Mâlikî</span><span class="mezhep-tag maliki">Mâlikî</span></div>
                  <div style="font-size:12.5px;">${m.h3}</div>
                </div>
                <div class="mezhep-card">
                  <div class="mezhep-header"><span class="mezhep-name">Hanbelî</span><span class="mezhep-tag hanbeli">Hanbelî</span></div>
                  <div style="font-size:12.5px;">${m.h4}</div>
                </div>
              </div>
              <div class="running-footer"><span>Câmiu'r-Ruhas</span><span>— ${pNum} —</span></div>
            </div>
          `
        });

        pages.push({
          density: 'soft',
          html: `
            <div class="page-inner">
              <div class="running-header"><span>${m.mesele.split(':')[0]}</span><span>TELFÎK &amp; FETVÂ</span></div>
              <div class="section-kicker">USÛLÎ TAHLİL</div>
              <h3 style="font-family:'Cormorant Garamond',serif; margin:4px 0; font-size:17px; color:var(--leather-outer);">Menşe-i Hilâf ve İllet Tahlili</h3>
              <div style="font-size:13.5px; text-align:justify; line-height:1.55;">${m.hilaf}</div>
              <div class="telfik-box">
                <div class="telfik-title">⚖ TELFÎK DENETİMİ VE FETVÂ GÜVENCESİ</div>
                <div style="line-height:1.45; margin-top:2px;">${m.telfik}</div>
              </div>
              <div class="running-footer"><span>Tahkîk</span><span>— ${pNum + 1} —</span></div>
            </div>
          `
        });
      });

      // Arka Kapak İçi
      pages.push({
        density: 'hard',
        html: `
          <div class="cover-inside">
            <div class="ex-libris-frame">
              <div style="font-family:'Cinzel',serif; font-size:12px; font-weight:700; color:var(--leather-dark);">HÂTİME-İ CİLT</div>
              <div class="cover-rule"></div>
              <div style="font-size:12px; color:var(--ink-soft);">Klasik Sert Cilt Mekanizması ile Ciltlenmiştir.</div>
            </div>
          </div>
        `
      });

      // Dış Arka Kapak
      pages.push({
        density: 'hard',
        html: `
          <div class="cover-face" style="justify-content:center; background: radial-gradient(circle at 35% 25%, rgba(255,255,255,0.1), transparent 40%), linear-gradient(150deg, ${book.theme.leather} 0%, ${book.theme.leatherDark} 100%);">
            <div class="shamsah"><svg viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"/></svg></div>
            <div class="cover-title-ar" style="font-size:20px;">تَمَّتْ بِحَمْدِ اللَّهِ</div>
            <div class="cover-rule"></div>
            <p style="font-family:'Cormorant Garamond',serif; font-size:14px; color:#c9b78f;">${book.title}</p>
          </div>
        `
      });

      return pages;
    }

    function openStPageFlipReader(bookData) {
      activeBookTitleEl.textContent = bookData.title;
      readerScreen.classList.add('screen-active');
      bookContainer.classList.remove('container-visible');

      if (pageFlipInstance) {
        pageFlipInstance.destroy();
        pageFlipInstance = null;
      }
      flipbookEl.innerHTML = '';

      currentPagesData = generatePages(bookData);

      currentPagesData.forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'page';
        div.setAttribute('data-density', p.density);
        div.innerHTML = p.html;
        flipbookEl.appendChild(div);
      });

      const isMobile = window.innerWidth <= 920;
      const targetW = isMobile ? Math.round(window.innerWidth * 0.92) : 470;
      const targetH = isMobile ? Math.round(window.innerHeight * 0.68) : 680;

      pageFlipInstance = new St.PageFlip(flipbookEl, {
        width: targetW,
        height: targetH,
        size: 'stretch',
        minWidth: 280,
        maxWidth: 1200,
        minHeight: 380,
        maxHeight: 1400,
        showCover: true,
        maxShadowOpacity: 0.55,
        usePortrait: isMobile,
        drawShadow: true,
        flippingTime: 800,
        startPage: 0
      });

      pageFlipInstance.loadFromHTML(document.querySelectorAll('#flipbook .page'));

      pageFlipInstance.on('flip', (e) => updateReaderUi(e.data));
      pageFlipInstance.on('changeState', (e) => {
        if (e.data === 'read') updateReaderUi(pageFlipInstance.getCurrentPageIndex());
      });

      updateReaderUi(0);

      // Kitap konteyneri yumuşakça belirir (büyüyerek + hafif yukarı kayarak)
      requestAnimationFrame(() => bookContainer.classList.add('container-visible'));

      // Ön kapak görünümünden sonra ilk sayfaya akıcı açılış
      setTimeout(() => {
        if (pageFlipInstance) pageFlipInstance.flipNext('bottom');
      }, 750);
    }

    function updateReaderUi(pageIdx) {
      const total = currentPagesData.length;
      bookContainer.classList.remove('is-cover-closed', 'is-back-closed');

      if (pageIdx === 0) {
        bookContainer.classList.add('is-cover-closed');
        pageStatusEl.innerHTML = '<strong>Ön Kapak</strong>';
      } else if (pageIdx === total - 1) {
        bookContainer.classList.add('is-back-closed');
        pageStatusEl.innerHTML = '<strong>Arka Kapak</strong>';
      } else {
        pageStatusEl.textContent = `Sayfa ${pageIdx} – ${Math.min(pageIdx + 1, total - 1)} / ${total - 2}`;
      }
    }

    /* =========================================================================
       5. BUTONLAR VE OLAYLAR
       ========================================================================= */
    document.getElementById('backToDeskBtn').addEventListener('click', triggerCloseBook);
    document.getElementById('prevBtn').addEventListener('click', () => pageFlipInstance && pageFlipInstance.flipPrev('bottom'));
    document.getElementById('nextBtn').addEventListener('click', () => pageFlipInstance && pageFlipInstance.flipNext('bottom'));
    document.getElementById('closeFrontBtn').addEventListener('click', () => pageFlipInstance && pageFlipInstance.turnToPage(0));
    document.getElementById('closeBackBtn').addEventListener('click', () => pageFlipInstance && pageFlipInstance.turnToPage(currentPagesData.length - 1));

    let currentZoom = 1.0;
    document.getElementById('zoomInBtn').addEventListener('click', () => {
      currentZoom = Math.min(1.6, currentZoom + 0.1);
      document.documentElement.style.setProperty('--zoom-factor', currentZoom);
      document.getElementById('zoomDisplay').textContent = Math.round(currentZoom * 100) + '%';
    });
    document.getElementById('zoomOutBtn').addEventListener('click', () => {
      currentZoom = Math.max(0.7, currentZoom - 0.1);
      document.documentElement.style.setProperty('--zoom-factor', currentZoom);
      document.getElementById('zoomDisplay').textContent = Math.round(currentZoom * 100) + '%';
    });

    let currentFontSize = 15;
    document.getElementById('fontIncBtn').addEventListener('click', () => {
      currentFontSize = Math.min(19, currentFontSize + 1);
      document.documentElement.style.setProperty('--book-font-size', currentFontSize + 'px');
    });
    document.getElementById('fontDecBtn').addEventListener('click', () => {
      currentFontSize = Math.max(12, currentFontSize - 1);
      document.documentElement.style.setProperty('--book-font-size', currentFontSize + 'px');
    });

    // Fihrist Modal
    const tocModal = document.getElementById('tocModal');
    document.getElementById('openTocBtn').addEventListener('click', () => {
      const list = document.getElementById('modalTocList');
      list.innerHTML = `
        <ul class="toc-list">
          <li class="toc-item" onclick="pageFlipInstance.turnToPage(2); tocModal.classList.remove('active');"><span>Mukaddime</span><span>s. 1</span></li>
          <li class="toc-item" onclick="pageFlipInstance.turnToPage(3); tocModal.classList.remove('active');"><span>Fihrist</span><span>s. 2</span></li>
          <li class="toc-item" onclick="pageFlipInstance.turnToPage(4); tocModal.classList.remove('active');"><span>Mesele 001: Abdestte Niyet</span><span>s. 3</span></li>
          <li class="toc-item" onclick="pageFlipInstance.turnToPage(6); tocModal.classList.remove('active');"><span>Mesele 002: Kan Çıkması</span><span>s. 5</span></li>
          <li class="toc-item" onclick="pageFlipInstance.turnToPage(8); tocModal.classList.remove('active');"><span>Mesele 003: Namazların Cem'i</span><span>s. 7</span></li>
        </ul>
      `;
      tocModal.classList.add('active');
    });
    document.getElementById('closeTocModal').addEventListener('click', () => tocModal.classList.remove('active'));

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (tocModal.classList.contains('active')) tocModal.classList.remove('active');
        else if (readerScreen.classList.contains('screen-active')) triggerCloseBook();
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update(time);
      camera.lookAt(CAMERA_LOOK.x, CAMERA_LOOK.y, CAMERA_LOOK.z);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
