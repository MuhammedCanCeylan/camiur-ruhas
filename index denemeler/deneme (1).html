<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CÂMİU'R-RUHAS VE TAHKÎKU'L-MEZÂHİB — Ciltli Fıkıh Kitaplığı</title>

<!-- StPageFlip Styles -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/css/page-flip.min.css">

<!-- Google Fonts: Amiri (Arabic), Cormorant Garamond, Cinzel, Crimson Pro -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    --leather-outer: #30110d;
    --leather-dark: #1a0806;
    --gold: #d4af37;
    --gold-bright: #f5d77f;
    --gold-dim: #94772b;
    --paper: #fbf6ec;
    --paper-dark: #eee3cc;
    --paper-edge: #decfae;
    --ink: #221810;
    --ink-soft: #4a3b2c;
    --ink-dim: #7a6a57;
    --ruby: #7a1d1d;
    --emerald: #1c5234;
    
    /* Dinamik Boyut Değişkenleri */
    --base-w: 470px;
    --base-h: 680px;
    --page-w: 470px;
    --page-h: 680px;
    --book-font-size: 15.5px;
    --zoom-factor: 1.0;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 30%, #302219 0%, #17100b 65%, #0d0906 100%);
    font-family: 'Crimson Pro', Georgia, serif;
    color: var(--ink);
    overflow: hidden;
    user-select: none;
  }

  /* Loş Masaüstü Ambiyans Işığı */
  .desk-glow {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 1200px 750px at 50% 20%, rgba(245, 215, 127, 0.09), transparent 75%);
    pointer-events: none; z-index: 1;
  }

  /* =========================================================================
     1. MASA / ZEMİN EKRANI (SEÇİM EKRANI)
     ========================================================================= */
  #desk-screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    z-index: 20;
    transition: opacity 0.6s ease, transform 0.6s ease;
    overflow-y: auto; overflow-x: hidden;
  }

  #desk-screen.screen-hidden {
    opacity: 0; pointer-events: none;
    transform: scale(1.05);
  }

  .desk-top-bar {
    padding: 24px 36px 10px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Cormorant Garamond', serif;
    z-index: 5;
  }
  .desk-logo {
    color: #f1e4c7; font-size: 22px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
  }
  .desk-badge {
    background: linear-gradient(135deg, var(--gold-dim), var(--gold));
    color: #1a0e08; font-size: 11px; font-weight: 700;
    padding: 3px 8px; border-radius: 4px; letter-spacing: 0.12em;
  }
  .desk-hint {
    color: #a89476; font-size: 14.5px; font-style: italic;
  }

  .desk-stage {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px 24px 50px;
    perspective: 1600px;
  }

  .desk-title-area {
    text-align: center; margin-bottom: 36px;
  }
  .desk-kicker {
    font-family: 'Cinzel', serif; font-size: 12px;
    letter-spacing: 0.35em; color: var(--gold);
    text-transform: uppercase; margin-bottom: 6px;
  }
  .desk-heading {
    font-family: 'Cormorant Garamond', serif;
    font-size: 38px; color: #fdf6e6; margin: 0;
    font-weight: 700; letter-spacing: 0.03em;
  }
  .desk-divider {
    width: 80px; height: 1.5px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 10px auto 0;
  }

  /* Ahşap Zemin Üzerinde Duran Kitaplar Rafı / Masası */
  .books-surface {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-end;
    gap: 45px;
    max-width: 1180px;
    width: 100%;
    padding: 20px 10px 40px;
    perspective: 1500px;
  }

  /* 3D Masaüstü Kitap Kartı */
  .desk-book-card {
    position: relative;
    width: 220px;
    height: 318px;
    cursor: pointer;
    transform-style: preserve-3d;
    transform: rotateX(12deg) rotateY(-8deg);
    transition: transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1), filter 0.45s;
    filter: drop-shadow(0 20px 25px rgba(0,0,0,0.65));
  }

  .desk-book-card:hover {
    transform: rotateX(0deg) rotateY(-2deg) translateY(-16px) scale(1.05);
    filter: drop-shadow(0 32px 35px rgba(0,0,0,0.85));
  }

  /* Tıklanınca Kamera Önüne Uçarak Yaklaşma Animasyonu */
  .desk-book-card.is-flying {
    animation: bookFlyToCamera 0.7s forwards cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 100;
  }
  @keyframes bookFlyToCamera {
    0% {
      transform: rotateX(12deg) rotateY(-8deg) scale(1);
      opacity: 1;
    }
    40% {
      transform: rotateX(0deg) rotateY(0deg) translate3d(0, -60px, 300px) scale(1.35);
      opacity: 0.95;
    }
    100% {
      transform: rotateX(0deg) rotateY(0deg) translate3d(0, -120px, 700px) scale(2.1);
      opacity: 0;
    }
  }

  /* 3D Cilt Parçaları */
  .dbc-cover, .dbc-spine, .dbc-pages {
    position: absolute; top: 0; height: 100%;
  }

  .dbc-cover {
    left: 0; width: 220px;
    border-radius: 2px 6px 6px 2px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 26px 18px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), inset 10px 0 16px -8px rgba(0,0,0,0.6);
    border: 1px solid rgba(212,175,55,0.3);
    position: relative;
  }
  .dbc-cover::before {
    content: ""; position: absolute; inset: 8px;
    border: 1.5px solid rgba(212,175,55,0.45); border-radius: 3px;
    pointer-events: none;
  }
  .dbc-cover::after {
    content: ""; position: absolute; inset: 12px;
    border: 1px dashed rgba(212,175,55,0.22);
    pointer-events: none;
  }

  .dbc-medallion {
    width: 54px; height: 54px; border-radius: 50%;
    border: 1.5px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
    background: radial-gradient(circle, rgba(212,175,55,0.2) 0%, rgba(0,0,0,0.4) 100%);
    box-shadow: 0 0 10px rgba(212,175,55,0.3);
  }
  .dbc-medallion svg { width: 30px; height: 30px; fill: var(--gold); }

  .dbc-arabic {
    font-family: 'Amiri', serif; font-size: 19px;
    color: var(--gold-bright); direction: rtl; margin-bottom: 4px;
    line-height: 1.25;
  }
  .dbc-title {
    font-family: 'Cormorant Garamond', serif; font-weight: 700;
    font-size: 17.5px; color: #f8eee0; margin: 0 0 8px;
    line-height: 1.2; letter-spacing: 0.02em;
  }
  .dbc-rule {
    width: 32px; height: 1px; background: var(--gold); margin: 6px 0 8px;
  }
  .dbc-desc {
    font-family: 'Crimson Pro', serif; font-size: 12.5px;
    color: #cbb998; line-height: 1.35; margin: 0 0 12px;
  }
  .dbc-badge {
    margin-top: auto; font-family: 'Cinzel', serif;
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
    padding: 3px 8px; border-radius: 3px; text-transform: uppercase;
  }
  .dbc-badge.ready {
    background: rgba(28,82,52,0.6); color: #86efac; border: 1px solid #34d399;
  }
  .dbc-badge.soon {
    background: rgba(0,0,0,0.45); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.2);
  }

  .dbc-spine {
    left: -24px; width: 24px;
    transform: rotateY(-90deg);
    transform-origin: right center;
    border-radius: 3px 0 0 3px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
  }
  .dbc-pages {
    right: -8px; width: 8px;
    border-radius: 0 2px 2px 0;
    background: repeating-linear-gradient(180deg, var(--paper-edge) 0 2px, #c3b290 2px 3px);
    transform: rotateY(90deg);
    transform-origin: left center;
    border: 1px solid rgba(0,0,0,0.25);
  }

  .desk-shadow {
    position: absolute;
    left: 5%; bottom: -18px; width: 90%; height: 26px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.7), transparent 70%);
    pointer-events: none;
    transform: rotateX(85deg);
  }

  /* =========================================================================
     2. OKUYUCU EKRANI (READER SCREEN)
     ========================================================================= */
  #reader-screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    z-index: 10;
    opacity: 0; pointer-events: none;
    transition: opacity 0.5s ease;
  }
  #reader-screen.screen-active {
    opacity: 1; pointer-events: auto;
  }

  /* Üst Kontrol Çubuğu */
  .top-toolbar {
    position: fixed; top: 0; left: 0; right: 0; height: 52px;
    background: linear-gradient(180deg, rgba(16,11,8,0.96) 0%, rgba(24,16,12,0.88) 100%);
    border-bottom: 1px solid rgba(212,175,55,0.25);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; z-index: 50;
    backdrop-filter: blur(8px);
    font-family: 'Cormorant Garamond', serif;
  }
  .reader-left {
    display: flex; align-items: center; gap: 12px;
  }
  .back-to-desk-btn {
    background: rgba(212,175,55,0.14);
    border: 1px solid rgba(212,175,55,0.45);
    color: #f7eed7; padding: 6px 14px 6px 10px;
    border-radius: 20px; font-family: 'Cormorant Garamond', serif;
    font-size: 14px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: all 0.2s ease;
  }
  .back-to-desk-btn:hover {
    background: rgba(212,175,55,0.28); color: #fff;
    transform: translateX(-2px);
  }

  .reader-title {
    color: #f1e4c7; font-size: 17px; font-weight: 700;
    letter-spacing: 0.05em;
  }
  .path-badge {
    color: #a89476; font-size: 12px; background: rgba(0,0,0,0.4);
    padding: 3px 8px; border-radius: 12px; border: 1px solid rgba(212,175,55,0.18);
    display: flex; align-items: center; gap: 5px;
    max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .path-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #34d399;
    box-shadow: 0 0 6px #34d399;
  }

  .top-actions { display: flex; align-items: center; gap: 8px; }
  .action-btn {
    background: rgba(233,220,192,0.08); border: 1px solid rgba(212,175,55,0.35);
    color: #efe2c4; padding: 5px 12px; border-radius: 6px;
    font-family: 'Cormorant Garamond', serif; font-size: 13.5px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
    transition: all 0.2s ease;
  }
  .action-btn:hover {
    background: rgba(212,175,55,0.22); color: #fff;
  }
  #fileInput { display: none; }

  /* 3D Sahne ve Kitap Taşıyıcısı */
  .viewport {
    position: fixed; inset: 52px 0 60px 0;
    display: flex; align-items: center; justify-content: center;
    perspective: 2600px;
    overflow: hidden;
  }

  /* Kitap Konteyneri */
  .book-container {
    position: relative;
    width: calc(var(--page-w) * 2);
    height: var(--page-h);
    transform-style: preserve-3d;
    transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), width 0.25s ease, height 0.25s ease;
  }

  /* KİTAP KAPALIYKEN (Ön Kapak):
     Kitap 1 sayfa genişliğinde ekrana tam ortalanır!
     Sol tarafındaki boş alan tamamen kaldırılır! */
  .book-container.is-cover-closed {
    transform: translateX(calc(var(--page-w) * -0.5));
  }

  /* KİTAP AÇIKKEN (2 Sayfa Açık):
     Ekranda tam ortada 2 sayfa olarak yayılır */
  .book-container.is-spread-open {
    transform: translateX(0);
  }

  /* EN SON SAYFADA (Arka Kapak Kapalı):
     Arka kapak ekrana tam ortalanır */
  .book-container.is-back-closed {
    transform: translateX(calc(var(--page-w) * 0.5));
  }

  /* Gerçekçi Kitap Masa Altı Gölgesi */
  .book-shadow {
    position: absolute;
    left: 50%; bottom: -32px; transform: translateX(-50%);
    width: 92%; height: 46px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.35) 45%, transparent 75%);
    filter: blur(5px);
    pointer-events: none; z-index: 1;
    transition: width 0.4s ease;
  }
  .is-cover-closed .book-shadow,
  .is-back-closed .book-shadow {
    width: 52%;
  }

  /* Cildin Dış Deri Kenarlık Dudağı (Lip / Overhang)
     Sayfalarla BİREBİR aynı oranda genişler, fazladan boşluk bırakmaz! */
  .cover-backbone {
    position: absolute;
    top: -8px; bottom: -8px;
    border-radius: 4px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.75), 0 0 0 1px rgba(212,175,55,0.3) inset;
    z-index: 0;
    pointer-events: none;
    transition: left 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                right 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Ön kapak kapalıyken sadece sağ yarıyı kaplar */
  .is-cover-closed .cover-backbone {
    left: var(--page-w);
    right: -8px;
  }
  /* Kitap açıkken iki sayfayı da kaplar */
  .is-spread-open .cover-backbone {
    left: -8px;
    right: -8px;
  }
  /* Arka kapak kapalıyken sadece sol yarıyı kaplar */
  .is-back-closed .cover-backbone {
    left: -8px;
    right: var(--page-w);
  }

  /* Kâğıt Kenar Kalınlığı (Giyotinli kâğıt bloğu) */
  .edge-right {
    position: absolute; top: 0; bottom: 0; right: -10px; width: 10px;
    background: repeating-linear-gradient(180deg, var(--paper-edge) 0 2px, #c3b290 2px 3px);
    border-radius: 0 3px 3px 0;
    box-shadow: inset -2px 0 4px rgba(0,0,0,0.22), 2px 2px 6px rgba(0,0,0,0.35);
    z-index: 2; pointer-events: none;
  }
  .edge-bottom {
    position: absolute; left: 4px; right: 4px; bottom: -10px; height: 10px;
    background: repeating-linear-gradient(90deg, var(--paper-edge) 0 2px, #c3b290 2px 3px);
    border-radius: 0 0 3px 3px;
    box-shadow: inset 0 -2px 4px rgba(0,0,0,0.22), 2px 2px 6px rgba(0,0,0,0.35);
    z-index: 2; pointer-events: none;
  }

  /* StPageFlip Ana Taşıyıcısı */
  #flipbook {
    width: calc(var(--page-w) * 2);
    height: var(--page-h);
    margin: 0 auto;
    position: relative;
    z-index: 5;
  }

  /* =========================================================================
     SAYFA VE CİLT STİLLERİ (SERT KAPAK / İÇ SAYFALAR)
     ========================================================================= */
  .page {
    width: 100%; height: 100%;
    background-color: var(--paper);
    overflow: hidden;
    box-sizing: border-box;
  }

  /* SERT KALIN KAPAK (KATLANMAZ, BÜKÜLMEZ DÜZLEMSEL DÖNER) */
  .page[data-density="hard"] {
    background-color: var(--leather-dark);
    box-shadow: none;
  }

  /* DIŞ ÖN VE ARKA CİLT KAPAĞI */
  .cover-face {
    width: 100%; height: 100%;
    color: #f7eed7;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 34px 26px;
    text-align: center;
    border: 2px solid rgba(212,175,55,0.45);
    position: relative;
    box-shadow: inset 0 0 32px rgba(0,0,0,0.85);
    box-sizing: border-box;
  }
  .cover-face::before {
    content: ""; position: absolute; inset: 10px;
    border: 1.5px solid rgba(212,175,55,0.65); border-radius: 2px; pointer-events: none;
  }
  .cover-face::after {
    content: ""; position: absolute; inset: 15px;
    border: 1px dashed rgba(212,175,55,0.35); pointer-events: none;
  }

  /* Tezhip Köşebentler */
  .cover-corner {
    position: absolute; width: 26px; height: 26px; border: 2px solid var(--gold);
    pointer-events: none; z-index: 2;
  }
  .cover-corner.tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
  .cover-corner.tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
  .cover-corner.bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
  .cover-corner.br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

  /* Gilded Şemse / Madalyon */
  .shamsah {
    width: 84px; height: 84px; border-radius: 50%;
    border: 2px solid var(--gold);
    box-shadow: 0 0 15px rgba(212,175,55,0.35), inset 0 0 12px rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
    background: radial-gradient(circle, rgba(212,175,55,0.2) 0%, rgba(0,0,0,0.4) 100%);
  }
  .shamsah svg { width: 48px; height: 48px; fill: var(--gold); }

  .cover-kicker {
    font-family: 'Cinzel', serif; font-size: 11px;
    letter-spacing: 0.35em; color: var(--gold);
    text-transform: uppercase; margin-bottom: 10px;
  }
  .cover-title-ar {
    font-family: 'Amiri', serif; font-size: 27px;
    font-weight: 700; color: var(--gold-bright);
    direction: rtl; margin: 4px 0 6px; line-height: 1.3;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  .cover-title-tr {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700; font-size: 23px; color: #f7eed7;
    margin: 0 0 10px; letter-spacing: 0.04em; line-height: 1.2;
  }
  .cover-rule {
    width: 60px; height: 1.5px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 10px auto 14px;
  }
  .cover-subtitle {
    font-family: 'Crimson Pro', serif; font-style: italic;
    font-size: 14px; color: #c9b78f; line-height: 1.4;
    max-width: 310px; margin: 0 0 20px;
  }
  .cover-author {
    font-family: 'Cormorant Garamond', serif; font-size: 13px;
    color: var(--gold); letter-spacing: 0.15em; text-transform: uppercase;
    border-top: 1px solid rgba(212,175,55,0.3); padding-top: 10px;
  }
  .cover-hint {
    position: absolute; bottom: 26px;
    font-size: 12px; color: #a89476; font-style: italic;
  }

  /* CİLT KAPAĞI İÇİ (EBRU / VAKIF YAN KÂĞIDI) */
  .cover-inside {
    width: 100%; height: 100%;
    background:
      radial-gradient(circle at 80% 20%, rgba(212,175,55,0.18), transparent 40%),
      radial-gradient(circle at 20% 80%, rgba(122,29,29,0.22), transparent 50%),
      repeating-radial-gradient(circle at 50% 50%, #e2d7c0 0 6px, #d2c4a3 6px 12px, #c5b592 12px 18px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 30px; text-align: center;
    box-shadow: inset 0 0 35px rgba(0,0,0,0.5);
    box-sizing: border-box;
  }
  .ex-libris-frame {
    background: rgba(251, 246, 236, 0.95);
    border: 2px solid var(--gold);
    padding: 24px 20px; border-radius: 4px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    max-width: 280px; width: 100%;
  }

  /* =========================================================================
     İÇ SAYFALAR (TÜM SAYFAYI DOLDURAN VE ORANTILI ÖLÇEKLENEN SAYFA TASARIMI)
     ========================================================================= */
  .page-inner {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    padding: 28px 24px 22px;
    position: relative;
    font-size: var(--book-font-size);
    line-height: 1.55;
    color: var(--ink);
    user-select: text;
    box-sizing: border-box;
  }

  /* Altın Yaldızlı İç Cetvel (Cedvel) */
  .page-inner::after {
    content: ""; position: absolute; inset: 10px;
    border: 1px solid rgba(212,175,55,0.45);
    border-radius: 2px;
    pointer-events: none;
  }

  .running-header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(143,114,38,0.35);
    padding-bottom: 6px; margin-bottom: 12px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px; color: var(--ink-dim);
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .running-footer {
    margin-top: auto;
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid rgba(143,114,38,0.25);
    padding-top: 6px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 12.5px; color: var(--ink-dim);
  }

## MESELE 001: Abdestte Niyetin Farziyeti ve Unutulması

## 1. RUHSAT VE EN HAFİF AMELÎ HÜKÜM (LİTE TATBİKAT)
- **Uygulanacak Kolaylık:** Abdestte niyet farz veya sıhhat şartı değildir, sünnettir. Niyetsiz alınan abdest sahihtir, onunla namaz kılınabilir.
- **Esas Alınan Mezhep:** Hanefî Mezhebi
- **Sıhhat ve Telfîk Güvencesi:** Bu amel, intisap edilen mezhebin rükün ve şartlarına bütünüyle uygundur. Dört mezhebin dördü tarafından da geçersiz sayılan bir terkip (icmâ-i mürekkep) doğurmaz; amel meşru ve sahihtir.

## 2. DÖRT MEZHEBİN DELİL VE İSTİDLÂL HARİTASI
### 1. Hanefî Mezhebi
- **Hüküm:** Sünnet / Müstehap (Abdestin sıhhat şartı değildir; su bizâtihi temizleyicidir).
- **Kaynak İbâre:** Şemsü'l-Eimme es-Serahsî (v. 483) (el_Mabsut, C:01, S:089)

### 2. Şâfiî Mezhebi
- **Hüküm:** Farz / Rükün (Niyetsiz abdest geçersizdir; hadesteki kirlilik ancak niyetle kalkar).
- **Kaynak İbâre:** Şemsüddîn er-Remlî (v. 1004) (Nihayetul_Muhtac, C:01, S:158)
«والأصل في وجوب النية قوله تعالى وما أمروا إلا ليعبدوا الله مخلصين والإخلاص النية»

### 3. Mâlikî Mezhebi
- **Hüküm:** Farz / Sıhhat Şartı (Niyet ibadetin ayrılmaz parçasıdır).
- **Kaynak İbâre:** el-Hattâb er-Ruaynî (v. 954) (Mawahibul_Jalil, C:01, S:235)
«المقصود منها تعظيم الله تعالى والخضوع له وذلك إنما يحصل إذا قصدت من أجله»

- **Hüküm:** Farz / Şart (Namaz gibi müstakil niyete muhtaçtır).

«شرط لطهارة الحدث وضوءا كانت أو غسلا ولتيمم ولو مسنونا»

## 3. MENŞE-İ HİLÂF VE İLLET TAHLİLİ
Dört mezhebin abdestte niyetin farz veya sıhhat şartı olup olmadığı konusundaki ihtilafı; nassların sübutu, lafızların delâlet mertebeleri ile tahâret amelinin mahiyetine dair illet ve hikmet tahlillerine dayanmaktadır. Hanefîler Mâide 6. âyetindeki çıplak emri esas alırken, Şâfiî ve Mâlikîler niyet hadisini sıhhat şartı kılar.

## 4. TELFÎK DENETİMİ VE FETVÂ
- **Telfîk Riski:** Yoktur. Hanefî mezhebinde niyet sünnettir.

Tavafta, kalabalıkta gayriihtiyari temas halinde abdest bozulmaz.

# BÖLÜM: KITÂBÜ'T-TAHÂRET
## MESELE 004: Vücuttan Kan veya İrin Çıkmasının Abdesti Bozması

## 1. RUHSAT VE EN HAFİF AMELÎ HÜKÜM (LİTE TATBİKAT)
- **Uygulanacak Kolaylık:** İki yol dışından (burun, yara, enjeksiyon vb.) çıkan kan veya irin ne kadar çok olursa olsun abdesti bozmaz.
- **Esas Alınan Mezhep:** Şâfiî ve Mâlikî Mezhepleri
- **Sıhhat ve Telfîk Güvencesi:** İcmâ-i mürekkep doğurmaz.

## 2. DÖRT MEZHEBİN DELİL VE İSTİDLÂL HARİTASI
### 1. Hanefî Mezhebi
- **Hüküm:** Yaradan çıkıp taşan kan bozar.
- **Kaynak İbâre:** es-Serahsî (v. 483) (el_Mabsut, C:01, S:089)
«خروج الدم نجس ينقض الوضوء إذا سال عن رأس الجرح»

### 2. Şâfiî Mezhebi
- **Hüküm:** Sebilayn dışındaki necaset çıkışı abdesti bozmaz.
- **Kaynak İbâre:** en-Nevevî (v. 676) (el_Mecmu, C:02, S:005)
«فأما الخارج من غير السبيلين كالدم والقيء فلا ينقض بحال»

### 3. Mâlikî Mezhebi
- **Hüküm:** Bedenden çıkan kan mutlak olarak bozmaz.
- **Kaynak İbâre:** el-Hattâb (v. 954) (Mawahibul_Jalil, C:01, S:496)
«ولا ينقض الخارج من غير مخرجه المعتاد كالفصد والحجامة»

### 4. Hanbelî Mezhebi
- **Hüküm:** Fahiş (çok) miktarda ise bozar.
- **Kaynak İbâre:** İbn Kudâme (v. 620) (el_Mugni, C:01, S:110)
«إن كان يسيرا لم ينقض وإن كان كثيرا نقض»

## 3. MENŞE-İ HİLÂF VE İLLET TAHLİLİ
Hadislerin sıhhati ve Hz. Ömer'in yarasından kan akarken namaz kılması rivayetinin yorumudur.

## 4. TELFÎK DENETİMİ VE FETVÂ
Tahlil için kan veren veya burnu kanayan mükellef Şâfiî mezhebiyle amel ederek namazını kılar.

# BÖLÜM: KITÂBÜ'S-SALÂT
## MESELE 005: Yolculukta ve Meşakkat Anında İki Namazın Birleştirilmesi (Cem')

## 1. RUHSAT VE EN HAFİF AMELÎ HÜKÜM (LİTE TATBİKAT)
- **Uygulanacak Kolaylık:** Seferde, yağmurda veya şiddetli meşakkatte Öğle-İkindi ile Akşam-Yatsı cem'-i takdîm veya te'hîr ile birleştirilebilir.
- **Esas Alınan Mezhep:** Şâfiî, Mâlikî ve Hanbelî Mezhepleri
- **Sıhhat ve Telfîk Güvencesi:** Amel müstakil içtihada dayalı ve sahihtir.

## 2. DÖRT MEZHEBİN DELİL VE İSTİDLÂL HARİTASI
### 1. Hanefî Mezhebi
- **Hüküm:** Hac hariç hiçbir yerde hakiki cem' caiz değildir.
- **Kaynak İbâre:** el-Kâsânî (v. 587) (Bedaiu_s_Sanai, C:01, S:133)
«تأخير الصلاة عن وقتها من الكبائر فلا يباح بعذر السفر»

### 2. Şâfiî Mezhebi
- **Hüküm:** Seferde ve yağmurda cem' sahihtir.
- **Kaynak İbâre:** en-Nevevî (v. 676) (el_Mecmu, C:04, S:322)
«يجوز الجمع بين الظهر والعصر في السفر»

### 3. Mâlikî Mezhebi
- **Hüküm:** Sefer ve yağmur meşakkatinde cem' caizdir.
- **Kaynak İbâre:** İbn Abdilberr (v. 463) (el_Kafi, C:01, S:035)
«ورخص مالك في الجمع في السفر لجد السير»

### 4. Hanbelî Mezhebi
- **Hüküm:** Sefer, hastalık, yağmur ve meşakkatte cem' caizdir (en geniş ruhsat).
- **Kaynak İbâre:** el-Merdâvî (v. 885) (el_Insaf, C:02, S:363)
«يجوز الجمع بين الصلاتين لعذر المطر والمرض والسفر»

## 3. MENŞE-İ HİLÂF VE İLLET TAHLİLİ
İbn Abbas'ın cem' hadislerini Hanefîler صورî cem'e yorarken cumhur hakiki cem' olarak kabul etmiştir.

## 4. TELFÎK DENETİMİ VE FETVÂ
Uzun yolda mola imkanı bulamayan kimse Hanbelî veya Şâfiî içtihadına uyarak cem' yapar.

# BÖLÜM: KITÂBÜ'S-SALÂT
## MESELE 006: Namazda İftitah Tekbiri Dışında Elleri Kaldırmak (Ref'u'l-Yedeyn)

## 1. RUHSAT VE EN HAFİF AMELÎ HÜKÜM (LİTE TATBİKAT)
- **Uygulanacak Kolaylık:** Eller yalnızca namaza başlarken kaldırılır; rükûda kaldırmamak sünnettir ve namaz sahihtir.
- **Esas Alınan Mezhep:** Hanefî Mezhebi
- **Sıhhat ve Telfîk Güvencesi:** Amel sahihtir.

## 2. DÖRT MEZHEBİN DELİL VE İSTİDLÂL HARİTASI
### 1. Hanefî Mezhebi
- **Hüküm:** İftitah haricinde eller kaldırılmaz.
- **Kaynak İbâre:** el-Kâsânî (v. 587) (Bedaiu_s_Sanai, C:01, S:214)
«فصلى ولم يرفع يديه إلا مرة واحدة»

### 2. Şâfiî Mezhebi
- **Hüküm:** Rükû iniş ve kalkışında elleri kaldırmak müekked sünnettir.
- **Kaynak İbâre:** en-Nevevî (v. 676) (el_Mecmu, C:03, S:379)
«رفع اليدين عند الركوع والرفع منه سنة صحيحة»

### 3. Mâlikî Mezhebi
- **Hüküm:** Yalnızca iftitah tekbirinde kaldırılır.
- **Kaynak İbâre:** el-Hattâb (v. 954) (Mawahibul_Jalil, C:01, S:520)
«المشهور أنه لا يرفع يديه إلا في تكبيرة الإحرام»

### 4. Hanbelî Mezhebi
- **Hüküm:** İftitah ve rükû geçişlerinde kaldırmak sünnettir.
- **Kaynak İbâre:** el-Buhûtî (v. 1051) (Kassafu_l_Kina, C:01, S:354)
«ويرفع يديه ندبا مع ابتداء تكبير الركوع»

## 3. MENŞE-İ HİLÂF VE İLLET TAHLİLİ
İbn Mes'ûd ile İbn Ömer rivayetleri arasındaki tercih ve nesh ihtilafıdır.

## 4. TELFÎK DENETİMİ VE FETVÂ
Hanefî tatbikatı namazdaki sükûn ve huşûu muhafaza eden en sade ameldir.

# BÖLÜM: KITÂBÜ'S-SALÂT
## MESELE 007: İmama Uyan Kişinin Fatiha Okuma Mecburiyeti

## 1. RUHSAT VE EN HAFİF AMELÎ HÜKÜM (LİTE TATBİKAT)
- **Uygulanacak Kolaylık:** Cemaatle namazda memûmun Fatiha okuması gerekmez; imamın kıraati cemaatin kıraatidir.
- **Esas Alınan Mezhep:** Hanefî Mezhebi
- **Sıhhat ve Telfîk Güvencesi:** Amel sahihtir.

## 2. DÖRT MEZHEBİN DELİL VE İSTİDLÂL HARİTASI
### 1. Hanefî Mezhebi
- **Hüküm:** Cemaatin kıraat yapması tahrîmen mekruhtur; sükût eder.
- **Kaynak İbâre:** es-Serahsî (v. 483) (el_Mabsut, C:01, S:211)
«من كان له إمام فقراءة الإمام له قراءة»

### 2. Şâfiî Mezhebi
- **Hüküm:** Fatiha her rekâtta imama da cemaate de farzdır.
- **Kaynak İbâre:** en-Nevevî (v. 676) (el_Mecmu, C:03, S:322)
«وجوب قراءة الفاتحة على المأموم في كل الركعات»

### 3. Mâlikî Mezhebi
- **Hüküm:** Gizlide müstehap, cehrîde sükût farzdır.
- **Kaynak İbâre:** İbn Abdilberr (v. 463) (el_Kafi, C:01, S:040)
«يقرأ المأموم في السرية ولا يقرأ فيما جهر فيه الإمام»

### 4. Hanbelî Mezhebi
- **Hüküm:** Gizlide okur, cehrîde dinler.
- **Kaynak İbâre:** el-Buhûtî (v. 1051) (Kassafu_l_Kina, C:01, S:463)
«تستحب قراءة الفاتحة للمأموم فيما لا يجهر فيه»

## 3. MENŞE-İ HİLÂF VE İLLET TAHLİLİ
A'râf 204. âyet ("Kur'an okunduğunda dinleyiniz") ile "Fatihasız namaz olmaz" hadisinin tahsisidir.

## 4. TELFÎK DENETİMİ VE FETVÂ
Cemaate uyan kişi Fatiha yetiştiremediğinde şüpheye düşmeyip Hanefî kavline uyarak sükût eder.

# BÖLÜM: KITÂBÜ'L-BÜYÛ'
## MESELE 008: Veresiye Verilen Borcun Başka Bir Borçla Takası (Kâli' bi'l-Kâli')

## 1. RUHSAT VE EN HAFİF AMELÎ HÜKÜM (LİTE TATBİKAT)
- **Uygulanacak Kolaylık:** Peşin bedel ödenmeksizin vadeli bir borcun başka bir vadeli borçla takası 4 mezhebin ittifakıyla bâtıldır; ruhsatı yoktur.
- **Esas Alınan Mezhep:** Ruhsat Yoktur (İcmâen Bâtıldır)
- **Sıhhat ve Telfîk Güvencesi:** Dört mezhebin icmâsıdır.

## 2. DÖRT MEZHEBİN DELİL VE İSTİDLÂL HARİTASI
### 1. Hanefî Mezhebi
- **Hüküm:** Bâtıldır ve faiz şüphesi taşır.
- **Kaynak İbâre:** es-Serahsî (v. 483) (el_Mabsut, C:12, S:169)
«نهى النبي عن بيع الكالئ بالكالئ يعني الدين بالدين»

### 2. Şâfiî Mezhebi
- **Hüküm:** Garar ve ribâ akitlerindendir, bâtıldır.
- **Kaynak İbâre:** en-Nevevî (v. 676) (el_Mecmu, C:09, S:391)
«هو النسئية بالنسئية وهو باطل»

### 3. Mâlikî Mezhebi
- **Hüküm:** İcmâ ile fâsittir.
- **Kaynak İbâre:** İbn Abdilberr (v. 463) (el_Kafi, C:01, S:363)
«وهذا إجماع لا خلاف فيه»

### 4. Hanbelî Mezhebi
- **Hüküm:** Kat'iyyen haramdır.
- **Kaynak İbâre:** el-Merdâvî (v. 885) (el_Insaf, C:05, S:070)
«وهو بيع الدين بالدين بالإجماع»

## 3. MENŞE-İ HİLÂF VE İLLET TAHLİLİ
Meselede hilaf yoktur. Borcun borçla satışı garar ve faiz doğurur.

## 4. TELFÎK DENETİMİ VE FETVÂ
Hiçbir mezhepte ruhsatı bulunmadığından buna cevaz verilemez. Mutlaka bir taraf peşin kabzedilmelidir.

# BÖLÜM: KITÂBÜ'L-BÜYÛ'
## MESELE 009: Vadeli Mal Alıp Peşin Geri Satmak (Bey'u'l-Îne ve Hile-i Şer'iyye)

## 1. RUHSAT VE EN HAFİF AMELÎ HÜKÜM (LİTE TATBİKAT)
- **Uygulanacak Kolaylık:** Ön şart koşulmadığı ve iki bağımsız akit yapıldığı müddetçe, niyet nakit temini olsa dahi akit zâhiren sahihtir (İmam Şâfiî zâhire göre hükmeder).
- **Esas Alınan Mezhep:** Şâfiî Mezhebi (Zâhirî Akit Geçerliliği)
- **Sıhhat ve Telfîk Güvencesi:** Amel zâhiren sahihtir.

## 2. DÖRT MEZHEBİN DELİL VE İSTİDLÂL HARİTASI
### 1. Hanefî Mezhebi
- **Hüküm:** Fâsittir ve tahrîmen mekruhtur; ribâ vesilesidir.
- **Kaynak İbâre:** İbn Âbidîn (v. 1252) (Reddul_Muhtar, C:05, S:186)
«وبيع العينة مكروه تحريما لما فيه من شبهة الربا»

### 2. Şâfiî Mezhebi
- **Hüküm:** Zâhirî şartlar tam ise ve şart koşulmamışsa caizdir.
- **Kaynak İbâre:** en-Nevevî (v. 676) (el_Mecmu, C:09, S:391)
«لأن البيعين تمّا بشرائطهما الظاهرة»

### 3. Mâlikî Mezhebi
- **Hüküm:** Sedd-i zerâi' kaidesince haram ve bâtıldır.
- **Kaynak İbâre:** el-Hattâb (v. 954) (Mawahibul_Jalil, C:04, S:368)
«سدا للذريعة المفضية إلى ربا الفضل والنسيئة»

### 4. Hanbelî Mezhebi
- **Hüküm:** Hile-i ribâ sayıldığından kat'iyyen haramdır.
- **Kaynak İbâre:** el-Merdâvî (v. 885) (el_Insaf, C:04, S:371)
«مسألة العينة فعلها محرم على الصحيح»

## 3. MENŞE-İ HİLÂF VE İLLET TAHLİLİ
Akitlerde niyetlere mi (Cumhur), yoksa zâhirî rükün ve lafızlara mı (İmam Şâfiî) itibar edileceği usûl ihtilafıdır.

    // 4. FİHRİST SAYFASI (SAYFA 2)
    pages.push({
      density: 'soft',
      type: 'toc',
      folio: 2,
      html: `
        <div class="page-inner">
          <div class="running-header">

    // 9 MESELE PARSER
    const rawSections = mdContent.split(/---\s*[\r\n]+/);

    rawSections.forEach((sec) => {
      const trimmed = sec.trim();
      if (!trimmed || trimmed.startsWith('# CÂMİU\'R-RUHAS') || trimmed.startsWith('### MUKADDİME')) return;

      if (trimmed.includes('MESELE ')) {

        let mezhepGridHtml = "";
        if (mezhepMatch) {
          const mText = mezhepMatch[1];

            const match = mText.match(regex);
            if (match) {
              const hukum = match[1];
              const kaynak = match[2];
              const arapca = match[3] || "";
              return `
                <div class="mezhep-card">
                  <div class="mezhep-header">
                    <span class="mezhep-name">${name}</span>
                    <span class="mezhep-tag ${cls}">${cls}</span>

                  ${arapca ? `<div class="arabic-quote">« ${arapca.trim()} »</div>` : ''}
                </div>
              `;
            }
            return "";
          }
          mezhepGridHtml = `<div class="mezhep-grid">
            ${extractMezhep('Hanefî Mezhebi', 'hanefi')}
            ${extractMezhep('Şâfiî Mezhebi', 'shafii')}
            ${extractMezhep('Mâlikî Mezhebi', 'maliki')}

        pages.push({

        // SAĞ SAYFA (Usûlî Tahlil & Telfik Güvencesi)

          folio: currentFolio,

              <div style="font-size:calc(var(--book-font-size) * 0.93); text-align:justify; line-height:1.55;">

              </div>
              <div class="running-footer">
                <span>Lite Tatbikat Tahkîki</span>
                <span>— ${currentFolio} —</span>
              </div>
            </div>
          `
        });
        currentFolio++;
      }
    });

    // HATİME
    pages.push({
      density: 'soft',
      type: 'content',
      folio: currentFolio,
      html: `
        <div class="page-inner">
          <div class="running-header">
            <span style="color:var(--gold-dim); font-weight:600;">CÂMİU'R-RUHAS</span>
            <span>HÂTİME-İ KÜLLİYAT</span>

            <li><strong>Telfîk-i Bâtıl:</strong> Dört mezhebin birden geçersiz sayacağı şekilde hükümleri birleştirmek (icmâ-i mürekkep ihlali). Bu külliyatta kesinlikle men edilmiştir.</li>

        </div>
      `

    currentFolio++;

    if (pages.length % 2 !== 0) {
      pages.push({
        density: 'soft',
        type: 'blank',
        folio: currentFolio,
        html: `
          <div class="page-inner" style="display:flex; align-items:center; justify-content:center; text-align:center;">
            <div style="opacity:0.4; font-family:'Cormorant Garamond',serif; font-style:italic;">(Beyâz Sahîfe — Notlar İçin Ayrılmıştır)</div>
          </div>
        `
      });
      currentFolio++;
    }
  }

  // 5. SERT ARKA CİLT KAPAĞI İÇİ (EBRU)
  pages.push({
    density: 'hard',
    type: 'cover-inside-back',
    html: `
      <div class="cover-inside">
        <div class="ex-libris-frame" style="max-width:260px;">

        </div>

  return pages;
}

/* =========================================================================
   1. MASAÜSTÜ KİTAPLARI OLUŞTURMA
   ========================================================================= */
function initDeskSurface() {
  booksSurface.innerHTML = '';
  BOOKS_CATALOG.forEach((book) => {
    const card = document.createElement('div');
    card.className = 'desk-book-card';
    card.setAttribute('data-id', book.id);
    card.innerHTML = `
      <div class="desk-shadow"></div>
      <div class="dbc-spine" style="background: linear-gradient(180deg, ${book.theme.leatherDark}, ${book.theme.leather} 40%, ${book.theme.leatherDark});"></div>
      <div class="dbc-cover" style="background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.08), transparent 45%), linear-gradient(150deg, ${book.theme.leather} 0%, ${book.theme.leatherDark} 100%);">
        <div class="dbc-medallion">
          <svg viewBox="0 0 24 24"><path d="M12,2L14.5,7.5L20.5,8.5L16,13L17.5,19L12,16L6.5,19L8,13L3.5,8.5L9.5,7.5L12,2Z"/></svg>
        </div>
        <div class="dbc-arabic">${book.arabicTitle}</div>
        <h3 class="dbc-title">${book.title}</h3>
        <div class="dbc-rule"></div>
        <div class="dbc-desc">${book.subtitle}</div>
        <div class="dbc-badge ${book.badgeClass}">${book.badge}</div>
      </div>
      <div class="dbc-pages"></div>
    `;

    card.addEventListener('click', () => {
      // 3D Uçma / Yaklaşma Animasyonu
      card.classList.add('is-flying');
      setTimeout(() => {
        openBookInReader(book);
        card.classList.remove('is-flying');
      }, 550);
    });

    booksSurface.appendChild(card);
  });
}

/* =========================================================================
   2. KİTAP AÇILIŞ VE KAPANIŞ MEKANİZMASI
   ========================================================================= */
function openBookInReader(book) {
  activeBook = book;
  activeBookTitleEl.textContent = book.shortTitle;
  filePathDisplay.textContent = book.filePath;

  // Temayı dinamik ata
  document.documentElement.style.setProperty('--leather-outer', book.theme.leather);
  document.documentElement.style.setProperty('--leather-dark', book.theme.leatherDark);
  document.documentElement.style.setProperty('--paper', book.theme.paper);
  document.documentElement.style.setProperty('--paper-dark', book.theme.paperDark);
  coverBackbone.style.background = `radial-gradient(circle at 20% 20%, rgba(255,255,255,0.06), transparent 50%), linear-gradient(155deg, ${book.theme.leather} 0%, ${book.theme.leatherDark} 100%)`;

  // Masaüstünü gizle, Okuyucuyu aç
  deskScreen.classList.add('screen-hidden');
  readerScreen.classList.add('screen-active');

  // Kitabı render et
  renderCurrentBook();

  // İlk açılışta ön kapaktan başlayıp hafif bir gecikmeyle ilk sayfayı aç
  setTimeout(() => {
    if (pageFlipInstance) {
      pageFlipInstance.flipNext('bottom');
    }
  }, 750);
}

function returnToDesk() {
  if (pageFlipInstance) {
    pageFlipInstance.turnToPage(0);
  }
  setTimeout(() => {
    readerScreen.classList.remove('screen-active');
    deskScreen.classList.remove('screen-hidden');
  }, 400);
}

backToDeskBtn.addEventListener('click', returnToDesk);

/* =========================================================================
   3. ST.PAGEFLIP OLUŞTURMA VE KAPAK HİZALAMA
   ========================================================================= */
function renderCurrentBook() {
  if (pageFlipInstance && typeof pageFlipInstance.destroy === 'function') {
    pageFlipInstance.destroy();
    pageFlipInstance = null;
  }
  flipbookElement.innerHTML = '';

  currentPagesData = buildPagesForBook(activeBook, activeMdContent);

  currentPagesData.forEach((pageData, index) => {
    const pageEl = document.createElement('div');
    pageEl.className = 'page';
    pageEl.setAttribute('data-density', pageData.density);
    pageEl.dataset.pageIndex = String(index);
    pageEl.innerHTML = pageData.html;
    flipbookElement.appendChild(pageEl);
  });

  const isMobile = window.innerWidth <= 920;
  const targetW = isMobile ? Math.round(window.innerWidth * 0.92) : Math.round(basePageWidth * currentZoom);
  const targetH = isMobile ? Math.round(window.innerHeight * 0.68) : Math.round(basePageHeight * currentZoom);

  document.documentElement.style.setProperty('--page-w', targetW + 'px');
  document.documentElement.style.setProperty('--page-h', targetH + 'px');

  pageFlipInstance = new St.PageFlip(flipbookElement, {
    width: targetW,
    height: targetH,
    size: 'stretch',
    minWidth: 280,
    maxWidth: 1200,
    minHeight: 380,
    maxHeight: 1400,
    showCover: true,
    maxShadowOpacity: 0.55,
    usePortrait: isMobile,
    drawShadow: true,
    flippingTime: 850,
    startPage: 0,
    autoSize: true,
    mobileScrollSupport: false
  });

  pageFlipInstance.loadFromHTML(document.querySelectorAll('#flipbook .page'));

  pageFlipInstance.on('flip', (e) => updateBookState(e.data));
  pageFlipInstance.on('changeState', () => updateBookState(pageFlipInstance.getCurrentPageIndex()));

  updateBookState(0);
  populateTocModal();
  bindTocClicks();
}

/* KİTAP KAPAK DURUMLARINI SENKRONİZE ET (Image 1 & 2 Düzeltmesi) */
function updateBookState(currentPageIdx) {
  if (!pageFlipInstance) return;
  const total = currentPagesData.length;

  bookContainer.classList.remove('is-cover-closed', 'is-spread-open', 'is-back-closed');

  if (currentPageIdx === 0) {
    // ÖN KAPAK KAPALI: Tek sayfa genişliği, ortalanmış, sol flap yok
    bookContainer.classList.add('is-cover-closed');
    pageStatusEl.innerHTML = '<strong>Ön Kapak (Cilt)</strong>';
  } else if (currentPageIdx === total - 1) {
    // ARKA KAPAK KAPALI: Tek sayfa genişliği, ortalanmış, sağ flap yok
    bookContainer.classList.add('is-back-closed');
    pageStatusEl.innerHTML = '<strong>Arka Kapak</strong>';
  } else {
    // KİTAP AÇIK: Tam 2 sayfa yayılımı
    bookContainer.classList.add('is-spread-open');
    if (currentPageIdx === 1) {
      pageStatusEl.innerHTML = 'İç Kapak &amp; Sayfa 1';
    } else {
      const leftNum = currentPageIdx;
      const rightNum = Math.min(currentPageIdx + 1, total - 1);
      pageStatusEl.textContent = `Sayfa ${leftNum} – ${rightNum} / ${total - 2}`;
    }
  }

  prevBtn.disabled = currentPageIdx <= 0;
  nextBtn.disabled = currentPageIdx >= total - 1;
}

/* =========================================================================
   4. ZOOM VE YAZI BOYUTU (Image 3 Düzeltmesi)
   ========================================================================= */
function applyZoom(newZoom) {
  currentZoom = Math.max(0.65, Math.min(1.5, newZoom));
  zoomDisplay.textContent = Math.round(currentZoom * 100) + '%';
  const w = Math.round(basePageWidth * currentZoom);
  const h = Math.round(basePageHeight * currentZoom);
  document.documentElement.style.setProperty('--page-w', w + 'px');
  document.documentElement.style.setProperty('--page-h', h + 'px');
  
  if (pageFlipInstance && typeof pageFlipInstance.updateSize === 'function') {
    pageFlipInstance.updateSize(w, h);
  }
}

function applyFontSize(delta) {
  currentFontSize = Math.max(12, Math.min(23, currentFontSize + delta));
  document.documentElement.style.setProperty('--book-font-size', currentFontSize + 'px');
  fontSizeDisplay.textContent = currentFontSize.toFixed(1) + 'px';
}

/* =========================================================================
   5. FİHRİST
   ========================================================================= */
function populateTocModal() {
  modalTocList.innerHTML = '';
  const list = document.createElement('ul');
  list.className = 'toc-list';

  const meseleNames = [
    { title: "Mukaddime ve Metodoloji", page: 2 },
    { title: "Fihrist-i Ebvâb", page: 3 },
    { title: "MESELE 001: Abdestte Niyetin Farziyeti", page: 4 },
    { title: "MESELE 002: Abdestte Tertip ve Muvâlât", page: 6 },
    { title: "MESELE 003: Karşı Cinsle Temasın Abdesti Bozması", page: 8 },
    { title: "MESELE 004: Vücuttan Kan veya İrin Çıkması", page: 10 },
    { title: "MESELE 005: Seferde Namazların Birleştirilmesi (Cem')", page: 12 },
    { title: "MESELE 006: Namazda Elleri Kaldırmak (Ref'u'l-Yedeyn)", page: 14 },
    { title: "MESELE 007: İmama Uyanın Fatiha Okuma Mecburiyeti", page: 16 },
    { title: "MESELE 008: Veresiye Borcun Takası (Kâli' bi'l-Kâli')", page: 18 },
    { title: "MESELE 009: Vadeli Alıp Peşin Satmak (Bey'u'l-Îne)", page: 20 },
    { title: "Hâtime ve Fıkhî Istılahat Lügatçesi", page: 22 }
  ];

  meseleNames.forEach((item, idx) => {
    const li = document.createElement('li');
    li.className = 'toc-item';
    li.innerHTML = `
      <span class="toc-num">${String(idx + 1).padStart(2, '0')}</span>
      <span class="toc-label">${item.title}</span>
      <span class="toc-page">s. ${item.page}</span>
    `;
    li.addEventListener('click', () => {
      tocModal.classList.remove('active');
      if (pageFlipInstance) pageFlipInstance.turnToPage(item.page);
    });
    list.appendChild(li);
  });
  modalTocList.appendChild(list);
}

function bindTocClicks() {
  document.querySelectorAll('#tocPageList .toc-item').forEach(item => {
    item.addEventListener('click', () => {
      const pageIndex = parseInt(item.getAttribute('data-goto'), 10);
      if (!isNaN(pageIndex) && pageFlipInstance) pageFlipInstance.turnToPage(pageIndex);
    });
  });
}

/* =========================================================================
   6. EVENT LISTENERS
   ========================================================================= */
prevBtn.addEventListener('click', () => pageFlipInstance && pageFlipInstance.flipPrev('bottom'));
nextBtn.addEventListener('click', () => pageFlipInstance && pageFlipInstance.flipNext('bottom'));

closeFrontBtn.addEventListener('click', () => pageFlipInstance && pageFlipInstance.turnToPage(0));
closeBackBtn.addEventListener('click', () => pageFlipInstance && pageFlipInstance.turnToPage(currentPagesData.length - 1));

fontIncBtn.addEventListener('click', () => applyFontSize(1));
fontDecBtn.addEventListener('click', () => applyFontSize(-1));
zoomInBtn.addEventListener('click', () => applyZoom(currentZoom + 0.1));
zoomOutBtn.addEventListener('click', () => applyZoom(currentZoom - 0.1));
zoomResetBtn.addEventListener('click', () => applyZoom(1.0));

fullscreenBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
});

openTocBtn.addEventListener('click', () => tocModal.classList.add('active'));
closeTocModal.addEventListener('click', () => tocModal.classList.remove('active'));
tocModal.addEventListener('click', (e) => { if (e.target === tocModal) tocModal.classList.remove('active'); });

filePickerBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    filePathDisplay.textContent = file.name;
    const reader = new FileReader();
    reader.onload = (evt) => {
      activeMdContent = evt.target.result;
      renderCurrentBook();
    };
    reader.readAsText(file, 'utf-8');
  }
});

window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault();
  if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
    const file = e.dataTransfer.files[0];
    filePathDisplay.textContent = file.name;
    const reader = new FileReader();
    reader.onload = (evt) => {
      activeMdContent = evt.target.result;
      renderCurrentBook();
    };
    reader.readAsText(file, 'utf-8');
  }
});

document.addEventListener('keydown', (e) => {
  if (e.target && /input|textarea/i.test(e.target.tagName)) return;
  if (!pageFlipInstance) return;

  if (e.key === 'ArrowRight' || e.key === 'PageDown') {
    e.preventDefault(); pageFlipInstance.flipNext('bottom');
  } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
    e.preventDefault(); pageFlipInstance.flipPrev('bottom');
  } else if (e.key === 'Home') {
    e.preventDefault(); pageFlipInstance.turnToPage(0);
  } else if (e.key === 'End') {
    e.preventDefault(); pageFlipInstance.turnToPage(currentPagesData.length - 1);
  } else if (e.key === '+' || e.key === '=') {
    applyZoom(currentZoom + 0.1);
  } else if (e.key === '-' || e.key === '_') {
    applyZoom(currentZoom - 0.1);
  } else if (e.key === 'Escape') {
    if (tocModal.classList.contains('active')) {
      tocModal.classList.remove('active');
    } else if (readerScreen.classList.contains('screen-active')) {
      returnToDesk();
    }
  }
});

window.addEventListener('resize', () => {
  const isMobile = window.innerWidth <= 920;
  const targetW = isMobile ? Math.round(window.innerWidth * 0.92) : Math.round(basePageWidth * currentZoom);
  const targetH = isMobile ? Math.round(window.innerHeight * 0.68) : Math.round(basePageHeight * currentZoom);
  document.documentElement.style.setProperty('--page-w', targetW + 'px');
  document.documentElement.style.setProperty('--page-h', targetH + 'px');
  if (pageFlipInstance && typeof pageFlipInstance.updateSize === 'function') {
    pageFlipInstance.updateSize(targetW, targetH);
  }
});

/* =========================================================================
   BAŞLANGIÇ
   ========================================================================= */
async function initApp() {
  initDeskSurface();

  // Arka planda yerel dosyayı fetch etmeyi dene
  try {
    const res = await fetch('Camiur_Ruhas_Nihai_Kulliyat.md');
    if (res.ok) {
      activeMdContent = await res.text();
    }
  } catch (err) {}
}

initApp();
</script>
